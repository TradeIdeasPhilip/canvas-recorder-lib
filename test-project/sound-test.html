<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="icon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔊 Soundtrack Test</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
      }

      }

        color: red;

      }

  <body>
    <h1>🔊 Soundtrack test</h1>

      Silent, and it takes a second or two.

    <table id="results">
      <tr>
        <th>Test</th>
        <th>Result</th>
        <th>Details</th>
      </tr>
    </table>
    <script type="module" src="./src/sound-test.ts"></script>
  </body>
