# Build the API docs with TypeDoc and publish them to GitHub Pages on every push to master.
# The generated HTML never gets committed.  Same pattern as riemann-surfaces-3d's deploy.yml.
# One-time setup:  Settings → Pages → Source:  "GitHub Actions".
name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]
  # Adds a "Run workflow" button on the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, finish the first deploy, then do the second.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # TypeDoc type checks the source, then writes HTML to docs/.
      - run: npm run docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
